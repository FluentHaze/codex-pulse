<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
  <rect width="800" height="640" fill="#fafbfc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1d1d1f">
    <text x="400" y="60" text-anchor="middle" font-size="28" font-weight="600">安装 Codex Pulse</text>
    <text x="400" y="92" text-anchor="middle" font-size="15" fill="#62656b">拖入应用程序，即可完成安装。</text>
    <!-- Finder supplies the real app and Applications icons and their labels. -->
    <path d="M373 185h54m-12-12 12 12-12 12" fill="none" stroke="#a2a8b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 280h728" stroke="#dfe3e8"/>
    <text x="40" y="315" font-size="18" font-weight="600">首次打开指引</text>
    <text x="760" y="315" text-anchor="end" font-size="12" fill="#62656b">仅首次需要</text>
    <path d="M281 344v88m244-88v88" stroke="#dfe3e8"/>
    <g fill="#e8f0fe">
      <circle cx="58" cy="360" r="18"/>
      <circle cx="305" cy="360" r="18"/>
      <circle cx="549" cy="360" r="18"/>
    </g>
    <g fill="#0066cc" font-size="13" font-weight="600" text-anchor="middle">
      <text x="58" y="365">01</text><text x="305" y="365">02</text><text x="549" y="365">03</text>
    </g>
    <g font-size="16" font-weight="600">
      <text x="88" y="366">移入应用程序</text>
      <text x="335" y="366">尝试打开一次</text>
      <text x="579" y="366">允许打开</text>
    </g>
    <g font-size="14" fill="#62656b">
      <text x="88" y="397"><tspan x="88">将应用拖入上方</tspan><tspan x="88" dy="22">「应用程序」文件夹。</tspan></text>
      <text x="335" y="397"><tspan x="335">从「应用程序」启动；</tspan><tspan x="335" dy="22">若被拦截，选择</tspan><tspan x="335" dy="22">「完成」或「取消」。</tspan></text>
      <text x="579" y="397"><tspan x="579">前往「隐私与安全性」，</tspan><tspan x="579" dy="22">找到 Codex Pulse，</tspan><tspan x="579" dy="22">点击「仍要打开」。</tspan></text>
    </g>
    <!-- The settings shortcut is a real Finder file, centered at (400, 490). -->
    <text x="400" y="595" text-anchor="middle" font-size="13" fill="#62656b">双击上方齿轮图标，打开系统设置。</text>
    <text x="400" y="624" text-anchor="middle" font-size="12" fill="#62656b">当前版本尚未经过 Apple 公证，请确认下载来源可信。</text>
  </g>
</svg>
