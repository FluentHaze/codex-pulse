name: Release Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Release the checked-in version; do not run pack:win, which increments it.
      - run: npx electron-builder --win nsis portable --x64 --publish never --config.directories.output=release/win
      - name: Verify and publish release assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable release version');
            const directory = 'release/win';
            const setup = `Codex Pulse-Setup-${version}-x64.exe`;
            const portable = `Codex Pulse-${version}-win-x64.exe`;
            const files = [setup, `${setup}.blockmap`, portable, 'latest.yml'];
            const digest = crypto.createHash('sha512').update(fs.readFileSync(path.join(directory, setup))).digest('base64');
            if (!fs.readFileSync(path.join(directory, 'latest.yml'), 'utf8').includes(digest)) {
              throw new Error('Installer SHA-512 does not match update manifest');
            }
            fs.writeFileSync(path.join(directory, 'SHA256SUMS.txt'), files.map(name =>
              `${crypto.createHash('sha256').update(fs.readFileSync(path.join(directory, name))).digest('hex')}  ${name.replace(/ /g, '-')}`
            ).join('\n') + '\n');
            const tag = `v${version}`;
            const repository = context.repo;
            const releases = await github.rest.repos.listReleases({ ...repository, per_page: 100 });
            let release = releases.data.find(item => item.tag_name === tag);
            if (release && !release.draft) throw new Error(`${tag} is already public; refusing to overwrite`);
            const body = [
              `## Windows ${tag}`,
              '- 新增 Setup 安装版，支持自动检查、后台下载，点击侧栏「重启更新」安装新版',
              '- 保留便携版，需手动下载替换',
              '- 官网 Windows 主下载入口切换为 Setup，并修正系统识别与按钮高亮',
              '- 各平台下载入口显示实际版本；Mac 继续提供现有安装包',
              '',
              '本次仅发布 Windows x64 二进制包及更新清单。源码中的 Mac 后台下载 DMG 与手动替换流程，仍需在 Mac 打包和真机验收。',
            ].join('\n');
            if (!release) {
              release = (await github.rest.repos.createRelease({ ...repository, tag_name: tag,
                target_commitish: context.sha, name: `${tag} · Windows Setup 与应用内更新`,
                body, draft: true, prerelease: false })).data;
            } else {
              await github.rest.repos.updateRelease({ ...repository, release_id: release.id, target_commitish: context.sha, body });
            }
            // Draft assets are replaceable; a public release is never overwritten.
            for (const name of [...files.slice(0, 3), 'SHA256SUMS.txt', 'latest.yml']) {
              const remoteName = name.replace(/ /g, '-');
              const existing = release.assets.find(asset => asset.name === remoteName);
              if (existing) await github.rest.repos.deleteReleaseAsset({ ...repository, asset_id: existing.id });
              const data = fs.readFileSync(path.join(directory, name));
              const uploaded = await github.rest.repos.uploadReleaseAsset({ ...repository,
                release_id: release.id, name: remoteName, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } });
              if (uploaded.data.size !== data.length) throw new Error(`Upload size mismatch: ${remoteName}`);
              core.info(`Uploaded ${remoteName}`);
            }
            await github.rest.repos.updateRelease({ ...repository, release_id: release.id,
              draft: false, make_latest: 'true' });
            core.notice(`Published ${release.html_url}`);
